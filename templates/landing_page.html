{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artonomy — Log in</title>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="{% static 'favicon/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'favicon/android-chrome-192x192.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'favicon/android-chrome-512x512.png' %}">
  <link rel="apple-touch-icon" href="{% static 'favicon/apple-touch-icon.png' %}">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Global fonts/styles (Poppins enforced in base.css) -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Remove the old Inter override */
    .mosaic img{object-fit:cover}
  </style>
</head>
<body class="bg-black text-gray-100">

  <!-- Single full-bleed background image + overlay -->
  <div class="fixed inset-0 -z-10">
    <div
      class="absolute inset-0 bg-cover bg-center"
      style="background-image:url('{% static "img/landing-bg.jpg" %}');">
    </div>
    <div class="absolute inset-0 bg-black/60"></div>
  </div>

  <!-- Mobile Header (unchanged) -->
<header class="lg:hidden fixed top-0 left-0 right-0 bg-black z-50">
  <div class="flex items-center justify-between h-16 px-4">
    <!-- Menu button -->
    <button class="text-2xl">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
    </button>

    <!-- Search button -->
    <button class="text-2xl">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </button>

    <!-- Logo + Name -->
    <div class="flex items-center gap-2">
      <img 
        src="{% static 'favicon/android-chrome-192x192.png' %}" 
        alt="Artonomy" 
        class="w-8 h-8 rounded-full object-contain bg-white/90 shadow-md"
      >
      <span class="font-bold text-lg">Artonomy</span>
    </div>

    <!-- Notification button -->
    <button class="text-2xl">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
    </button>
  </div>
</header>


  <!-- Side-by-side layout; vertically align BOTH columns -->
  <main class="min-h-screen flex items-center">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 w-full">
      <div class="flex flex-col lg:flex-row items-center lg:items-center justify-center lg:justify-between gap-10 lg:gap-14 min-h-[70vh]">

        <!-- Hero Section (aligned with form) -->
        <section class="lg:max-w-3xl flex items-center">
          <h1 class="text-left text-4xl sm:text-5xl lg:text-7xl font-extrabold leading-tight tracking-tight">
            Artonomy Where<br/> The Art Connects <span class="text-purple-500">•</span>
          </h1>
        </section>

        <!-- Form Card Section -->
        <section class="w-full max-w-md">
          <div class="lg:bg-white lg:text-gray-900 lg:rounded-[32px] lg:shadow-2xl lg:shadow-black/30">
            <div class="lg:p-6 lg:sm:p-8">

              <!-- Your logo on the form -->
             <div class="flex justify-center">
              <img
                src="{% static 'favicon/android-chrome-192x192.png' %}"
                alt="Artonomy"
                class="w-14 h-14 rounded-full object-contain shadow-md bg-white/80"
                onerror="this.style.display='none'">
            </div>

              <!-- Login Form -->
              <form method="post" action="{% url 'landing' %}" class="mt-8 space-y-5">
                {% csrf_token %}

                <div>
                  <label class="block text-sm font-medium mb-2 text-gray-300 lg:text-gray-700">Email</label>
                  <input type="email" name="email" placeholder="you@example.com"
                         class="w-full h-12 text-base rounded-full border-none bg-[#1C1C1E] lg:border lg:border-gray-300 lg:bg-white px-5 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white lg:text-gray-900"/>
                </div>

                <div>
                  <label class="block text-sm font-medium mb-2 text-gray-300 lg:text-gray-700">Password</label>
                  <div class="relative">
                    <input id="login-pass" type="password" name="password" placeholder="password"
                           class="w-full h-12 text-base rounded-full border-none bg-[#1C1C1E] lg:border lg:border-gray-300 lg:bg-white pl-5 pr-14 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white lg:text-gray-900"/>
                    <button type="button" data-toggle="#login-pass"
                            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 grid place-items-center rounded-full text-gray-400 lg:text-gray-500 hover:text-gray-200 lg:hover:text-gray-700">
  <i class="fa-solid fa-eye text-gray-500 lg:text-gray-600"></i>


                    </button>
                  </div>
                </div>

                <button type="submit"
                  class="w-full h-12 rounded-full text-white font-semibold text-base !mt-8 transition-colors"
                  style="background-color:#570080;"
                  onmouseover="this.style.backgroundColor='#6b0aa0';"
                  onmouseout="this.style.backgroundColor='#570080';">
                  Log in
                </button>


                <p class="text-xs text-gray-300 lg:text-gray-600 leading-relaxed text-center !mt-6">
                  By continuing, you agree to Artonomy’s
                  <a href="#" class="underline">Terms of Service</a>
                  and acknowledge you’ve read our
                  <a href="#" class="underline">Privacy Policy</a>.
                  <a href="#" class="underline">Notice at collection</a>.
                </p>

                <div class="pt-1 text-center !mt-6">
  <span class="text-base lg:text-lg text-gray-300 lg:text-gray-800">
    Not on Artonomy yet?
  </span>
  <a href="{% url 'signup' %}"
     class="font-semibold transition-colors"
     style="color:#E1A0FF; font-size:1.1rem;"
     onmouseover="this.style.color='#6b0aa0';"
     onmouseout="this.style.color='#E1A0FF';">
    Sign up
  </a>
</div>

              </form>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- eye toggles script -->
  <script>
    document.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.querySelector(btn.dataset.toggle);
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        const ic = btn.querySelector('i');
        if (ic) {
          ic.classList.toggle('fa-eye', !show);
          ic.classList.toggle('fa-eye-slash', show);
        }
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        try { input.focus({preventScroll:true}); const l = input.value.length; input.setSelectionRange(l,l); } catch(_) {}
      });
    });
  </script>
</body>
</html>
