<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artonomy — Log in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .mosaic img{object-fit:cover}
  </style>
</head>
<body class="bg-black text-gray-100">

  <!-- BG mosaic (hidden on mobile) -->
  <div class="fixed inset-0 -z-10 hidden lg:block">
    <div class="absolute inset-0 mosaic opacity-80">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6 md:p-10">
        <!-- Images for the mosaic background -->
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1554995207-c1e86f03c5b2?q=80&w=1200" alt="Abstract architectural design" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1526318472351-c75fcf070305?q=80&w=1200" alt="Colorful abstract painting" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200" alt="Winding road through a forest" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1495567720989-cebdbdd97913?q=80&w=1200" alt="Person standing on a rock looking at mountains" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1200" alt="Lake with mountains in the background" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?q=80&w=1200" alt="Portrait of a woman" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=1200" alt="Mountain range with a pink sky" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
        <img class="rounded-2xl h-48 md:h-56" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=1200" alt="Portrait of a woman with curly hair" onerror="this.onerror=null;this.src='https://placehold.co/400x400/000000/ffffff?text=Image';">
      </div>
    </div>
    <div class="absolute inset-0 bg-black/55"></div>
  </div>

  <!-- Mobile Header (visible only on mobile) -->
  <header class="lg:hidden fixed top-0 left-0 right-0 bg-black z-50">
      <div class="flex items-center justify-between h-16 px-4">
          <button class="text-2xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
          <button class="text-2xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </button>
          <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-600 to-indigo-600 grid place-items-center text-white font-extrabold text-lg">A</div>
              <span class="font-bold text-lg">Artonomy</span>
          </div>
          <button class="text-2xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          </button>
      </div>
  </header>

  <!-- Layout: stacked on mobile, side-by-side on desktop -->
  <main class="min-h-screen flex items-center pt-24 lg:pt-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 w-full">
      <div class="flex flex-col lg:flex-row items-center lg:items-start justify-center lg:justify-between gap-10 lg:gap-14">
        
        <!-- Hero Section -->
        <section class="lg:max-w-3xl lg:mt-24 text-center lg:text-left">
          <h1 class="text-4xl sm:text-5xl lg:text-7xl font-extrabold leading-tight tracking-tight">
            Artonomy Where<br class="hidden sm:block lg:hidden"/> The Art Connects <span class="text-purple-500">•</span>
          </h1>
        </section>

        <!-- Form Card Section -->
        <section class="w-full max-w-md mt-8 lg:mt-0">
          <!-- Desktop Card Styling -->
          <div class="lg:bg-white lg:text-gray-900 lg:rounded-[32px] lg:shadow-2xl lg:shadow-black/30">
            <div class="lg:p-6 lg:sm:p-8">
              <!-- Desktop-only header elements -->
              <div class="hidden lg:block mx-auto w-12 h-12 rounded-full bg-gradient-to-br from-purple-600 to-indigo-600 grid place-items-center text-white font-extrabold">A</div>
              <h2 class="hidden lg:block mt-5 text-center text-[28px] font-extrabold leading-tight">
                Welcome to<br/>Artonomy
              </h2>

              <!-- Login Form -->
              <form method="post" action="{% url 'landing' %}" class="mt-8 space-y-5">
                {% csrf_token %}

                <div>
                  <label class="block text-sm font-medium mb-2 text-gray-400 lg:text-gray-700">Email</label>
                  <input type="email" name="email" placeholder="Give Us Your Email"
                         class="w-full h-12 text-base rounded-full border-none bg-[#1C1C1E] lg:border lg:border-gray-300 lg:bg-white px-5 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white lg:text-gray-900"/>
                </div>

                <div>
                  <label class="block text-sm font-medium mb-2 text-gray-400 lg:text-gray-700">Password</label>
                  <div class="relative">
                    <input id="login-pass" type="password" name="password" placeholder="Do You Remind It?"
                           class="w-full h-12 text-base rounded-full border-none bg-[#1C1C1E] lg:border lg:border-gray-300 lg:bg-white pl-5 pr-14 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white lg:text-gray-900"/>
                    <button type="button" data-toggle="#login-pass"
                            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 grid place-items-center rounded-full text-gray-400 lg:text-gray-500 hover:text-gray-200 lg:hover:text-gray-700">
                      <i class="fa-regular fa-eye"></i>
                    </button>
                  </div>
                </div>

                <button type="submit"
                        class="w-full h-12 rounded-full bg-purple-700 hover:bg-purple-800 text-white font-semibold text-base !mt-8">
                  Log in
                </button>

                <!-- {% if messages %}
                  <div class="text-red-500 text-sm mt-2 text-center">
                    {% for msg in messages %}
                      <p>{{ msg }}</p>
                    {% endfor %}
                  </div>
                {% endif %} -->

                <p class="text-xs text-gray-400 lg:text-gray-500 leading-relaxed text-center !mt-6">
                  By continuing, you agree to Artonomy’s
                  <a href="#" class="underline">Terms of Service</a>
                  and acknowledge you’ve read our
                  <a href="#" class="underline">Privacy Policy</a>.
                  <a href="#" class="underline">Notice at collection</a>.
                </p>

                <div class="pt-1 text-sm text-gray-300 lg:text-gray-800 text-center !mt-6">
                  Not on Artonomy yet?
                  <a href="{% url 'signup' %}" class="font-semibold text-purple-500 lg:text-purple-700 hover:text-purple-400 lg:hover:text-purple-800">Sign up</a><br>
                  <!-- Are you an artist? <a href="#" class="font-semibold text-purple-500 lg:text-purple-700 hover:text-purple-400 lg:hover:text-purple-800">Get started here!</a> -->
                </div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- eye toggles script -->
  <script>
    document.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.querySelector(btn.dataset.toggle);
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        const ic = btn.querySelector('i');
        if (ic) {
            ic.classList.toggle('fa-eye', !show);
            ic.classList.toggle('fa-eye-slash', show);
        }
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        // Safely focus and set cursor position
        try {
            input.focus({preventScroll:true});
            const l = input.value.length; 
            input.setSelectionRange(l,l);
        } catch(_) {}
      });
    });
  </script>
</body>
</html>
