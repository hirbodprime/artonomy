{# props: step (int), steps (list[str]) #}
<style>
  .wiz-wrap{background:#0f1320; border:1px solid #222733; border-radius:14px;}
  .wiz-strip{display:flex; gap:.75rem; overflow-x:auto; padding:.6rem .75rem;}
  .wiz-strip::-webkit-scrollbar{display:none}
  .wiz-dot{
    min-width:34px; height:34px; border-radius:999px; display:grid; place-items:center;
    font-weight:800; color:#cbd3e6; background:#12141a; border:1px solid #222733;
  }
  .wiz-dot.active{ color:#fff; background:linear-gradient(135deg,#570080,#7b1bb8);
    box-shadow:0 8px 24px rgba(87,0,128,.35)}
  /* connector for ≥sm only */
  @media (min-width:640px){
    .wiz-dot{min-width:38px; height:38px}
    .wiz-item{display:flex; align-items:center; gap:.75rem}
    .wiz-hr{width:44px; height:2px; background:linear-gradient(90deg,rgba(87,0,128,.6),rgba(87,0,128,.1)); border-radius:2px}
  }
</style>
<div class="wiz-wrap mb-4 sm:mb-6">
  <div class="wiz-strip">
    {% for label in steps %}
      <div class="wiz-item">
        <div class="wiz-dot {% if forloop.counter == step %}active{% endif %}">{{ forloop.counter }}</div>
        {% if not forloop.last %}
          <div class="wiz-hr hidden sm:block"></div>
        {% endif %}
      </div>
    {% endfor %}
  </div>
</div>
