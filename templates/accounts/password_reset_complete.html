<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>گذرواژه تغییر کرد | آرتونومی</title>
  <style>
    :root{
      --bg:#09090b;--panel-2:#1c1c1e;
      --text-1:#f3f3f5;--text-2:#bdbdc5;
      --accent-light:#b49eff;
      --radius:28px;--shadow:0 18px 40px rgba(0,0,0,.65);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;background:var(--bg);color:var(--text-1);
      font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,"Vazirmatn",sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .card{
      width:100%;max-width:460px;
      background:var(--panel-2);
      border-radius:var(--radius);
      padding:26px 24px;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.08);
      text-align:center;
    }
    h1{margin:0 0 10px;font-size:21px;}
    p{margin:0 0 16px;font-size:14px;color:var(--text-2);line-height:1.8;}
    a{color:var(--accent-light);text-decoration:none;font-weight:600;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <main class="card">
    <h1>گذرواژه با موفقیت تغییر کرد</h1>
    <p>اکنون می‌توانید با گذرواژه جدید وارد حساب خود شوید.</p>
    <p>
      <a href="{% url 'login' %}">رفتن به صفحه ورود</a>
    </p>
  </main>
</body>
</html>
