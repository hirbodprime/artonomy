{% extends "accounts/hero_base.html" %}
{% block page_title %}Artonomy — Welcome{% endblock %}

{% block right_card %}
<div class="bg-white text-gray-900 card-shell overflow-hidden">
  <div class="p-6 sm:p-8">
    <div class="mx-auto w-12 h-12 rounded-full hero-badge grid place-items-center text-white text-xl">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
    </div>

    <h2 class="mt-4 text-center text-[28px] sm:text-[30px] font-extrabold leading-tight">
      You’re an<br/>Artonomist
    </h2>

    <button id="btnCompleteProfile"
            class="mt-6 w-full h-11 rounded-full bg-purple-700 hover:bg-purple-800 text-white
                   font-semibold text-sm transition-colors">
      Complete Your Profile
    </button>

    <button id="btnGoApp"
            class="mt-3 w-full h-11 rounded-full bg-neutral-900 hover:bg-neutral-800 text-white
                   font-semibold text-sm transition-colors">
      Go to Artonomy
    </button>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('btnCompleteProfile')?.addEventListener('click', () => {
    console.log('Complete profile → go to /me');
  });
  document.getElementById('btnGoApp')?.addEventListener('click', () => {
    console.log('Go to Artonomy → /discover');
  });
</script>
{% endblock %}
