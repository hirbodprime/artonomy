{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="max-w-md mx-auto p-4 sm:p-6">
  <div class="rounded-2xl border border-white/10 bg-[#171A22] p-5 sm:p-6 shadow-2xl">
    <h1 class="text-2xl font-extrabold mb-2" style="color:#E6E8EC">{% trans "Enter verification code" %}</h1>
    <p class="text-sm text-gray-300 mb-4">
      {% blocktrans %}We sent a code to {{ email }}. It expires in 15 minutes.{% endblocktrans %}
    </p>

    <form method="post" class="space-y-3">
      {% csrf_token %}
      <label class="block text-sm font-semibold mb-1" for="id_code" style="color:#E6E8EC">{% trans "Code" %}</label>
      {{ form.code }}
      <div class="flex gap-2 mt-2">
        <a href="{% url 'email_verify_start' %}" class="px-3 py-2 rounded-xl border border-white/10 text-gray-200">{% trans "Resend" %}</a>
        <button class="flex-1 px-4 py-2 rounded-xl font-bold text-black" style="background:#11C865">
          {% trans "Verify" %}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
