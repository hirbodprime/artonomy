{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="max-w-md mx-auto p-4 sm:p-6">
  <div class="rounded-2xl border border-white/10 bg-[#171A22] p-5 sm:p-6 shadow-2xl">
    <h1 class="text-2xl font-extrabold mb-2" style="color:#E6E8EC">{% trans "Forgot your password?" %}</h1>
    <p class="text-sm text-gray-300 mb-4">{% trans "Enter your account email. We’ll send you a 6-digit code to reset your password." %}</p>

    <form method="post" class="space-y-3">
      {% csrf_token %}
      <label class="block text-sm font-semibold mb-1" for="id_email" style="color:#E6E8EC">{% trans "Email" %}</label>
      {{ form.email }}
      <button class="w-full mt-3 px-4 py-2 rounded-xl font-bold text-black"
              style="background:linear-gradient(135deg,#7D5CFF,#9F7DFF)">
        {% trans "Send reset code" %}
      </button>
    </form>
  </div>
</div>
{% endblock %}
