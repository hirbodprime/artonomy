{% extends "base.html" %}
{% load i18n %}
{% block content %}
<style>
  :root { --purple:#C240FF; --background:#101015; --panel-bg:rgba(255,255,255,.05); --panel-border:rgba(255,255,255,.1); }
  .type-card{ background:var(--panel-bg); border:1px solid var(--panel-border); transition:.3s; cursor:pointer; }
  .type-card:hover{ transform:translateY(-8px); background:rgba(194,64,255,.1); border-color:var(--purple); box-shadow:0 0 30px -5px var(--purple); }
  .type-card svg{ transition:.3s; }
  .type-card:hover svg{ transform:scale(1.1); color:var(--purple); }
</style>

<div class="flex items-center justify-center min-h-[calc(100vh-10rem)] text-white">
  <div class="text-center w-full max-w-4xl mx-auto px-4">
    <h1 class="text-3xl sm:text-4xl font-bold mb-12 animate-slideUp">{% trans "Start building your project:" %}</h1>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 sm:gap-8 animate-fadeIn" style="animation-delay:.3s;">
      <!-- Photo -->
      <a href="{% url 'post_new_media' %}?t=PHOTO" class="flex flex-col items-center gap-4 p-8 rounded-2xl type-card">
        <!-- svg ... -->  <!-- (kept exactly) -->
        <svg class="w-12 h-12 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
        <span class="font-semibold text-lg">{% trans "Photo" %}</span>
      </a>

      <!-- Video -->
      <a href="{% url 'post_new_media' %}?t=VIDEO" class="flex flex-col items-center gap-4 p-8 rounded-2xl type-card">
        <svg class="w-12 h-12 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 01-.557-.328V8.887c0-.286.357-.466.557-.327l5.603 3.112z" /></svg>
        <span class="font-semibold text-lg">{% trans "Video" %}</span>
      </a>

      <!-- Music (disabled) — unchanged -->
      <div class="flex flex-col items-center gap-4 p-8 rounded-2xl type-card opacity-50 cursor-not-allowed" title="{% trans 'Coming Soon!' %}">
        <!-- svg kept -->
        <svg class="w-12 h-12 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V7.5a2.25 2.25 0 012.25-2.25h1.5A2.25 2.25 0 0118 7.5v3.553m-3-1.123l1.32.377a1.803 1.803 0 01-.99 3.467l-2.31-.66a2.25 2.25 0 00-1.632 2.163v3.75a2.25 2.25 0 01-2.25 2.25H6.75a2.25 2.25 0 01-2.25-2.25v-3.75a2.25 2.25 0 00-1.632-2.163l-2.31-.66a1.803 1.803 0 01-.99-3.467l1.32.377m0 0l10.5-3m-10.5 3l10.5-3" /></svg>
        <span class="font-semibold text-lg text-gray-500">{% trans "Music" %}</span>
      </div>

      <!-- Text -->
      <a href="{% url 'post_new_text' %}?t=TEXT" class="flex flex-col items-center gap-4 p-8 rounded-2xl type-card">
        <svg class="w-12 h-12 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
        <span class="font-semibold text-lg">{% trans "Text" %}</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
