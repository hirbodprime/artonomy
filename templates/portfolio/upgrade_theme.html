{% extends "base.html" %}
{% block title %}Unlock {{ theme.name }}{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-2">Unlock “{{ theme.name }}”</h1>
          <p class="text-muted">This is a premium template.</p>
          <p class="mb-4">Price: <strong>{{ theme.price_cents|floatformat:-2 }} USD</strong></p>
          <form method="post">
            {% csrf_token %}
            <!-- Replace this button with your Stripe/PayPal checkout redirect -->
            <button class="btn btn-primary">Pay & Unlock</button>
            <a class="btn btn-outline-secondary ms-2" href="{% url 'portfolio:theme_gallery' %}">Back</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
