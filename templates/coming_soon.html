<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* UPDATED: Using your specific brand colors */
            --primary-color: #570080;
            --secondary-color: #A239FF; /* Using the old primary as the new secondary for a nice gradient */
            --background-color: #0a0a10;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: white;
            overflow: hidden;
            position: relative;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .content-container {
            position: relative;
            z-index: 10;
            background: rgba(18, 20, 26, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1s ease-out, pulse-glow 6s infinite alternate;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        /* UPDATED: Glow animation now uses the new brand colors */
        @keyframes pulse-glow {
            from { box-shadow: 0 0 30px -10px rgba(87, 0, 128, 0.5); }
            to { box-shadow: 0 0 40px 0px rgba(162, 57, 255, 0.4); }
        }
        /* Responsive Countdown Styles */
        .countdown-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            text-align: center;
            padding: 0.75rem;
            width: 64px; /* Base size for mobile */
        }
        @media (min-width: 640px) { /* sm breakpoint */
            .countdown-item {
                width: 90px;
                padding: 1rem;
            }
        }
        .countdown-number {
            font-weight: 700;
            line-height: 1;
            font-size: 1.75rem; /* Base size for mobile */
        }
        @media (min-width: 640px) {
            .countdown-number {
                font-size: 2.5rem;
            }
        }
        .countdown-label {
            color: #9ca3af;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.6rem; /* Base size for mobile */
        }
        @media (min-width: 640px) {
            .countdown-label {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <canvas id="bg-canvas"></canvas>

    <div class="content-container text-center p-6 sm:p-10 max-w-2xl mx-auto rounded-2xl">
        <h1 class="text-5xl md:text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-300">
            The Art Galaxy Awaits
        </h1>
        <p class="mt-5 text-lg leading-8 text-gray-300 max-w-xl mx-auto">
            A new universe of creativity is about to unfold. Join the waitlist to be among the first to explore it and claim your exclusive launch rewards.
        </p>
        
        <div id="countdown" class="flex justify-center gap-2 sm:gap-4 my-10 text-white">
            <div class="countdown-item">
                <div id="days" class="countdown-number">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div id="hours" class="countdown-number">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div id="minutes" class="countdown-number">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div id="seconds" class="countdown-number">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <form class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto" id="notify-form">
            <input type="email" placeholder="your@email.com" required class="flex-1 px-5 py-3 text-sm bg-white/5 border border-white/10 rounded-full focus:ring-2 focus:ring-[var(--primary-color)] focus:outline-none placeholder-gray-500 transition-all duration-300">
            <button type="submit" class="px-8 py-3 text-sm font-semibold text-white bg-[var(--primary-color)] rounded-full hover:bg-opacity-90 transition-all duration-300 transform hover:scale-105 shadow-[0_0_25px_-5px_var(--primary-color)]">
                Join Waitlist
            </button>
        </form>
        <div id="form-message" class="mt-4 text-sm text-green-400 h-5"></div>

        <div class="mt-10 pt-6 border-t border-white/10">
            <a href="{% url 'home' %}" class="text-sm text-gray-400 hover:text-white transition-colors">Return to Homepage</a>
            <div class="flex justify-center gap-6 mt-4">
                <a href="#" class="text-gray-400 hover:text-[var(--primary-color)] transition-colors">Twitter</a>
                <a href="#" class="text-gray-400 hover:text-[var(--primary-color)] transition-colors">Instagram</a>
                <a href="#" class="text-gray-400 hover:text-[var(--primary-color)] transition-colors">Discord</a>
            </div>
        </div>
    </div>

    <script>
        // --- Three.js Art Galaxy Background ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const clock = new THREE.Clock();

        // --- Galaxy Core ---
        const galaxyParameters = {
            count: 20000,
            size: 0.02,
            radius: 5,
            branches: 3,
            spin: 1,
            randomness: 0.2,
            randomnessPower: 3,
            // UPDATED: Using your new brand colors for the galaxy
            insideColor: '#570080',
            outsideColor: '#A239FF'
        };

        let galaxyGeometry = null;
        let galaxyMaterial = null;
        let galaxyPoints = null;

        const generateGalaxy = () => {
            if (galaxyPoints !== null) {
                galaxyGeometry.dispose();
                galaxyMaterial.dispose();
                scene.remove(galaxyPoints);
            }

            galaxyGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(galaxyParameters.count * 3);
            const colors = new Float32Array(galaxyParameters.count * 3);
            const colorInside = new THREE.Color(galaxyParameters.insideColor);
            const colorOutside = new THREE.Color(galaxyParameters.outsideColor);

            for (let i = 0; i < galaxyParameters.count; i++) {
                const radius = Math.random() * galaxyParameters.radius;
                const spinAngle = radius * galaxyParameters.spin;
                const branchAngle = (i % galaxyParameters.branches) / galaxyParameters.branches * Math.PI * 2;
                
                const randomX = Math.pow(Math.random(), galaxyParameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * galaxyParameters.randomness * radius;
                const randomY = Math.pow(Math.random(), galaxyParameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * galaxyParameters.randomness * radius;
                const randomZ = Math.pow(Math.random(), galaxyParameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * galaxyParameters.randomness * radius;

                positions[i * 3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i * 3 + 1] = randomY;
                positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / galaxyParameters.radius);
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            galaxyMaterial = new THREE.PointsMaterial({
                size: galaxyParameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true
            });

            galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
            scene.add(galaxyPoints);
        };
        generateGalaxy();

        // --- Distant Stars ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const posArray = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 500;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ size: 0.2, color: 0xffffff, transparent: true, opacity: 0.5 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);
        
        // --- Shooting Stars ---
        const shootingStarGeo = new THREE.BufferGeometry();
        const shootingStarPositions = new Float32Array(1 * 3);
        shootingStarPositions[0] = -200; // Start off-screen
        shootingStarGeo.setAttribute('position', new THREE.BufferAttribute(shootingStarPositions, 3));
        const shootingStarMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true });
        const shootingStar = new THREE.Points(shootingStarGeo, shootingStarMat);
        scene.add(shootingStar);

        let shootingStarResetTimer = 0;
        function resetShootingStar() {
            shootingStar.position.x = (Math.random() - 0.5) * 300;
            shootingStar.position.y = Math.random() * 100 + 50;
            shootingStar.position.z = (Math.random() - 0.5) * 200;
            shootingStarResetTimer = Math.random() * 5 + 3;
        }
        resetShootingStar();


        // --- Animation Loop ---
        camera.position.z = 10;
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            galaxyPoints.rotation.y = elapsedTime * 0.1;
            starField.rotation.y = elapsedTime * 0.02;

            // Animate shooting star
            shootingStar.position.x += 2;
            shootingStar.position.y -= 0.5;
            shootingStarResetTimer -= clock.getDelta();
            if (shootingStarResetTimer <= 0) {
                resetShootingStar();
            }

            camera.position.x += (mouseX * 2 - camera.position.x) * 0.02;
            camera.position.y += (mouseY * 2 - camera.position.y) * 0.02;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Countdown Timer ---
        const countDownDate = new Date();
        countDownDate.setDate(countDownDate.getDate() + 30);
        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("days").innerText = String(d).padStart(2, '0');
            document.getElementById("hours").innerText = String(h).padStart(2, '0');
            document.getElementById("minutes").innerText = String(m).padStart(2, '0');
            document.getElementById("seconds").innerText = String(s).padStart(2, '0');
            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown").innerHTML = "<div class='text-2xl font-bold'>We have launched!</div>";
            }
        }, 1000);

        // --- Notify Form ---
        const notifyForm = document.getElementById('notify-form');
        const formMessage = document.getElementById('form-message');
        notifyForm.addEventListener('submit', function(e) {
            e.preventDefault();
            formMessage.textContent = 'Thank you! We will be in touch soon.';
            notifyForm.reset();
            setTimeout(() => formMessage.textContent = '', 4000);
        });
    </script>

</body>
</html>
