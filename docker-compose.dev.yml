version: "3.9"
services:
  web:
    user: "root" 
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DJANGO_DEBUG: "True"
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:5000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
  static_volume:
